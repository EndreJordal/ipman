<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Many logo hosts reject hotlinked requests that carry a Referer. -->
    <meta name="referrer" content="no-referrer" />
    <title>ipman</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>" />
  </head>
  <body>
    <div id="app" class="app">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h1 class="brand">ipman</h1>
          <nav class="sections" aria-label="Sections">
            <button type="button" class="section-btn" data-section="live" aria-pressed="true">TV</button>
            <button type="button" class="section-btn" data-section="movie" aria-pressed="false">MOVIES</button>
            <button type="button" class="section-btn" data-section="series" aria-pressed="false">SERIES</button>
          </nav>
          <div class="header-actions">
            <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings">⚙</button>
            <button id="collapse-btn" class="icon-btn" title="Hide channel list" aria-label="Hide channel list">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
            </button>
          </div>
        </div>
        <div class="filters">
          <div class="filter-row">
            <select id="country-select" aria-label="Country"></select>
            <select id="category-select" aria-label="Category"></select>
          </div>
          <input id="search" type="search" placeholder="Search channels   /" autocomplete="off" aria-label="Search channels" />
        </div>
        <div id="channel-count" class="channel-count"></div>
        <div id="channel-list" class="channel-list" role="listbox" aria-label="Channels"></div>
        <nav id="movie-categories" class="category-list" aria-label="Movie categories"></nav>
        <nav id="series-categories" class="category-list" aria-label="Series categories"></nav>
        <div class="shortcuts">↑↓ zap · ←→ seek · Space pause · F fullscreen · M mute · S favorite · / search</div>
      </aside>

      <main class="stage">
        <section id="movie-browser" class="movie-browser" aria-labelledby="movie-heading">
          <header class="movie-browser-head">
            <h2 id="movie-heading">All movies</h2>
            <span id="movie-count" class="muted"></span>
            <label class="movie-sort">
              Sort by
              <select id="movie-sort">
                <option value="title">Title (A–Z)</option>
                <option value="year">Year (newest first)</option>
                <option value="rating">Rating (highest first)</option>
              </select>
            </label>
          </header>
          <div id="movie-grid" class="movie-grid"></div>
        </section>
        <section id="series-browser" class="movie-browser" aria-labelledby="series-heading">
          <header class="movie-browser-head">
            <h2 id="series-heading">All series</h2>
            <span id="series-count" class="muted"></span>
            <label class="movie-sort">
              Sort by
              <select id="series-sort">
                <option value="title">Title (A–Z)</option>
                <option value="year">Year (newest first)</option>
                <option value="rating">Rating (highest first)</option>
              </select>
            </label>
          </header>
          <div id="series-grid" class="movie-grid"></div>
        </section>
        <button id="expand-btn" class="icon-btn expand-btn" title="Show channel list" aria-label="Show channel list" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
        </button>
        <div id="player-wrap" class="player-wrap">
          <video id="video" playsinline></video>
          <canvas id="subtitle-canvas" class="subtitle-canvas" hidden></canvas>
          <div id="overlay" class="overlay" hidden></div>
          <div id="controls" class="controls">
            <div id="seek-row" class="ctl-seek-row" hidden>
              <input id="seek" class="ctl-seek" type="range" min="0" max="1000" step="1" value="0" aria-label="Seek" />
            </div>
            <div class="ctl-row">
              <button id="play-btn" class="ctl-btn" title="Pause (Space)" aria-label="Pause">
                <svg class="filled" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" /></svg>
              </button>
              <span id="ctl-live" class="ctl-live">LIVE</span>
              <span id="ctl-time" class="ctl-time" hidden></span>
              <span class="ctl-spacer"></span>
              <button id="mute-btn" class="ctl-btn" title="Mute (M)" aria-label="Mute">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" /><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" /></svg>
              </button>
              <input id="volume" class="ctl-volume" type="range" min="0" max="1" step="0.05" aria-label="Volume" />
              <button id="subtitle-btn" class="ctl-btn subtitle-btn" title="Subtitles" aria-label="Subtitles" aria-haspopup="menu" aria-expanded="false" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5" /><path d="M10.5 10.2a2.2 2.2 0 1 0 0 3.6M17 10.2a2.2 2.2 0 1 0 0 3.6" /></svg>
              </button>
              <button id="fullscreen-btn" class="ctl-btn" title="Fullscreen (F)" aria-label="Fullscreen">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
              </button>
              <button id="more-btn" class="ctl-btn" title="More" aria-label="More options" aria-haspopup="menu" aria-expanded="false">
                <svg class="filled" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5.5" r="1.8" /><circle cx="12" cy="12" r="1.8" /><circle cx="12" cy="18.5" r="1.8" /></svg>
              </button>
            </div>
          </div>
          <div id="subtitle-menu" class="ctl-menu subtitle-menu" role="menu" aria-label="Subtitles" hidden></div>
          <div id="more-menu" class="ctl-menu more-menu" role="menu" aria-label="More options" hidden>
            <button id="pip-item" class="menu-item" role="menuitem">Picture-in-picture</button>
            <button id="reload-item" class="menu-item" role="menuitem">Reload stream</button>
          </div>
        </div>
        <div class="now-playing">
          <button type="button" id="back-btn" class="back-btn">← Movies</button>
          <img id="np-logo" class="logo" alt="" hidden />
          <div class="np-text">
            <div id="np-name" class="np-name">No channel selected</div>
            <div id="np-group" class="np-group"></div>
            <div id="np-epg" class="np-epg" hidden></div>
          </div>
          <span id="np-resolution" class="res-pill" hidden></span>
          <span id="np-status" class="np-status"></span>
          <button id="np-fav" class="star" title="Favorite (S)" aria-label="Toggle favorite" hidden>☆</button>
        </div>
        <section id="episodes" class="episodes" aria-label="Seasons and episodes">
          <div id="season-tabs" class="season-tabs" role="tablist" aria-label="Seasons"></div>
          <div id="episode-list" class="episode-list"></div>
        </section>
      </main>
    </div>

    <dialog id="movie-dialog" class="movie-dialog" aria-labelledby="md-title">
      <div id="md-backdrop" class="md-backdrop"></div>
      <button type="button" id="md-close" class="icon-btn md-close" aria-label="Close">✕</button>
      <div class="md-body">
        <img id="md-poster" class="md-poster" alt="" />
        <div class="md-info">
          <h2 id="md-title"></h2>
          <div id="md-facts" class="md-facts"></div>
          <p id="md-plot" class="md-plot"></p>
          <dl id="md-meta" class="md-meta"></dl>
          <div class="md-actions">
            <button type="button" id="md-play" class="primary">▶ Play Movie</button>
            <button type="button" id="md-restart" hidden>↺ Play from start</button>
            <button type="button" id="md-fav">☆ Favorite</button>
            <a id="md-trailer" target="_blank" rel="noreferrer" hidden>Trailer ↗</a>
            <a id="md-tmdb" target="_blank" rel="noreferrer" hidden>TMDb ↗</a>
          </div>
          <p id="md-status" class="muted" role="status"></p>
        </div>
      </div>
    </dialog>

    <dialog id="series-dialog" class="movie-dialog" aria-labelledby="sd-title">
      <div id="sd-backdrop" class="md-backdrop"></div>
      <button type="button" id="sd-close" class="icon-btn md-close" aria-label="Close">✕</button>
      <div class="md-body">
        <img id="sd-poster" class="md-poster" alt="" />
        <div class="md-info">
          <h2 id="sd-title"></h2>
          <div id="sd-facts" class="md-facts"></div>
          <p id="sd-plot" class="md-plot"></p>
          <dl id="sd-meta" class="md-meta"></dl>
          <div class="md-actions">
            <button type="button" id="sd-play" class="primary">▶ Start watching</button>
            <button type="button" id="sd-fav">☆ Favorite</button>
            <a id="sd-trailer" target="_blank" rel="noreferrer" hidden>Trailer ↗</a>
            <a id="sd-tmdb" target="_blank" rel="noreferrer" hidden>TMDb ↗</a>
          </div>
          <p id="sd-status" class="muted" role="status"></p>
        </div>
      </div>
    </dialog>

    <dialog id="settings-dialog">
      <form method="dialog">
        <h2>Settings</h2>
        <label>
          Playlist URL (M3U)
          <input id="playlist-url" type="url" required placeholder="https://provider.example/get.php?…&type=m3u_plus" />
        </label>
        <label>
          <span>TV guide URL (XMLTV) <span class="muted">optional</span></span>
          <input id="epg-url" type="url" placeholder="Auto: from the playlist, or the provider's xmltv.php" />
        </label>
        <fieldset class="xtream">
          <legend>Xtream account <span class="muted">optional: plot, cast and ratings for movies and series</span></legend>
          <p id="xtream-detected" class="muted"></p>
          <div class="xtream-fields">
            <label>
              Server
              <input id="xtream-server" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="http://server:8080" />
            </label>
            <label>
              Username
              <input id="xtream-username" type="text" autocomplete="off" spellcheck="false" />
            </label>
            <label>
              Password
              <span class="password-field">
                <input id="xtream-password" type="password" autocomplete="new-password" spellcheck="false" />
                <button type="button" id="xtream-show" class="link-button" aria-label="Show password">Show</button>
              </span>
            </label>
          </div>
          <div class="xtream-actions">
            <button type="button" id="xtream-test">Test connection</button>
            <span id="xtream-status" class="xtream-status" role="status"></span>
          </div>
        </fieldset>
        <label class="check">
          <input id="use-proxy" type="checkbox" />
          <span>Route playlist and streams through the local proxy <span class="muted">(fixes CORS and http-on-https blocking; built into the ipman server)</span></span>
        </label>
        <p id="settings-info" class="muted"></p>
        <section class="about">
          <div class="about-row">
            <span id="app-version" class="muted"></span>
            <label class="check inline">
              <input id="check-updates" type="checkbox" />
              <span>Check for updates</span>
            </label>
          </div>
          <div id="update-notice" class="update-notice" hidden>
            <strong id="update-title"></strong>
            <p id="update-how"></p>
            <div id="update-command-row" class="command-row">
              <code id="update-command"></code>
              <button type="button" id="copy-command">Copy</button>
            </div>
            <div class="update-actions">
              <a id="release-link" target="_blank" rel="noreferrer">What's new</a>
              <button type="button" id="skip-version" class="link-button">Skip this version</button>
            </div>
          </div>
        </section>
        <div class="actions">
          <button value="cancel" formnovalidate>Cancel</button>
          <button value="save" class="primary">Save &amp; reload playlist</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
